name: Keep Render Alive

# Runs every 5 minutes (GitHub Actions minimum). This pings the deployed
# Render URL so the free-tier service never spins down / cold-starts.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        run: |
          curl -fsS -m 30 --retry 2 "${{ secrets.RENDER_URL }}/health" \
            && echo "Ping OK" \
            || echo "Ping failed (check RENDER_URL secret)"